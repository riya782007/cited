name: Deploy app config to Shopify

# Pushes shopify.app.toml (scopes, URLs, webhooks incl. compliance topics)
# and any extensions to Shopify as a new app version.
# Auth: a Shopify service account token (App development permission) stored
# as the repo secret SHOPIFY_SERVICE_ACCOUNT_TOKEN.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "shopify.app.toml"
      - "extensions/**"

permissions:
  contents: read

concurrency:
  group: shopify-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest
      - name: Deploy
        env:
          SHOPIFY_SERVICE_ACCOUNT_TOKEN: ${{ secrets.SHOPIFY_SERVICE_ACCOUNT_TOKEN }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: shopify app deploy --allow-updates --source-control-url "$COMMIT_URL"
