# Cited by Newvora — Shopify app configuration (deployed by GitHub Actions)
client_id = "249c0ef1514eb4e1a20cdc8ea95d146b"
name = "Cited by Newvora"
application_url = "https://cited.newvora.in"
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
scopes = "read_products,write_products,read_orders,read_legal_policies"

[auth]
redirect_urls = [
  "https://cited.newvora.in/auth/callback",
  "https://cited.newvora.in/auth/shopify/callback"
]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Mandatory compliance topics for public apps
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request"]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/redact"]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = ["shop/redact"]
  uri = "/webhooks/shop/redact"
